<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>RecipeBox</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#2C4A33">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="RecipeBox">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500;600;700&display=swap" />
  <script src="/app-config.js"></script>
  <script src="/shopping-list.js"></script>
  <script src="/recipe-tags.js"></script>
  <script src="/nutrition.js"></script>
  <script src="/recipe-extract.js"></script>
  <script src="/recipe-grounding.js"></script>
  <script src="/recipe-schema.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    /* Brand background is a single SOLID color on the root element, propagated
       across the whole viewport canvas (incl. overscroll + the iOS home-indicator
       strip). A solid color has no gradient endpoints, so it can never seam — the
       bottom line is impossible. Everything else (body, #root, splash, auth, cook
       mode) is transparent and shows this through. */
    html { min-height: 100%; overflow-x: hidden; background-color: #2C4A33; overscroll-behavior: none; }
    body { margin: 0; min-height: 100dvh; overflow-x: hidden; font-family: 'DM Sans', sans-serif; background: transparent; color: #2A1B13; overscroll-behavior: none; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; -webkit-text-size-adjust: 100%; -webkit-touch-callout: none; }
    #root { min-height: 100vh; min-height: 100dvh; overflow-x: hidden; background: transparent; }
    /* While signed in and inside the app, the backdrop is cream (matches the
       screens) so a swipe/transition never flashes the green canvas behind a
       page. Splash/auth keep the transparent (green) backdrop. */
    body.in-app { background-color: #F8F1E5; }
    input, textarea, select, [contenteditable="true"] { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
    button { -webkit-touch-callout: none; touch-action: manipulation; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: none; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes timerPulse { 0%, 100% { transform: scale(1); box-shadow: 0 0 0 rgba(212,79,61,0); } 50% { transform: scale(1.025); box-shadow: 0 0 36px rgba(212,79,61,0.35); } }
    @keyframes splashIn { from { opacity: 0; transform: translateY(12px) scale(0.98); } to { opacity: 1; transform: none; } }
    @keyframes splashGlow { 0%, 100% { box-shadow: 0 18px 55px rgba(28,20,16,0.24); } 50% { box-shadow: 0 22px 70px rgba(196,98,45,0.32); } }
    .fade-up { animation: fadeUp 0.3s ease both; }
    .card { transition: transform 0.18s, box-shadow 0.18s; cursor: pointer; }
    .card:hover { transform: translateY(-3px); box-shadow: 0 8px 28px rgba(92,61,46,0.15); }
    @media (hover: none) { .card:hover { transform: none; box-shadow: none; } }
    .card:active { transform: scale(0.985); transition: transform 0.08s ease; }
    /* Screen/tab transitions: ease content in directionally so navigation and
       swipes feel smooth instead of a hard cut. Forward slides from the right,
       back from the left, lateral/unknown fades. */
    /* Transform-only (no opacity) so the incoming screen is opaque from the first
       frame — no full-screen flash of the backdrop on back. Only a thin edge
       strip slides, over the matching cream in-app backdrop. */
    @keyframes navFwd { from { transform: translate3d(30px,0,0); } to { transform: none; } }
    @keyframes navBack { from { transform: translate3d(-30px,0,0); } to { transform: none; } }
    @keyframes navFade { from { opacity: 0; } to { opacity: 1; } }
    .nav-fwd { animation: navFwd 0.26s cubic-bezier(0.33,1,0.68,1) both; will-change: transform; }
    .nav-back { animation: navBack 0.26s cubic-bezier(0.33,1,0.68,1) both; will-change: transform; }
    .nav-fade { animation: navFade 0.2s ease both; }
    @media (prefers-reduced-motion: reduce) { .nav-fwd, .nav-back, .nav-fade { animation: none; } }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: #DDD3C4; border-radius: 3px; }
    input::placeholder, textarea::placeholder { color: #C4A882; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .modal-box { background: #FAF7F2; border-radius: 20px; width: 100%; max-width: 420px; overflow: hidden; animation: slideUp 0.25s ease; }
    .meal-plan-row { background: #FCF2E1; border: 1px solid #D8C7AE; border-radius: 9px; padding: 9px 10px; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; align-items: center; gap: 10px; max-width: 100%; }
    .meal-plan-title { font-size: 0.86em; font-weight: 700; color: #20140E; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .meal-plan-meta { font-size: 0.72em; color: #967966; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .meal-plan-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; min-width: max-content; }
    .admin-shell { height: 100vh; height: 100dvh; max-width: 100vw; overflow-x: clip; overflow-y: auto; overscroll-behavior-y: contain; -webkit-overflow-scrolling: touch; }
    .admin-header-inner, .admin-content { width: min(1120px, calc(100vw - 32px)); margin: 0 auto; max-width: 100%; min-width: 0; }
    .admin-content { padding: 18px 0 calc(132px + env(safe-area-inset-bottom)); display: grid; gap: 16px; }
    .admin-stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; min-width: 0; }
    .admin-panel { min-width: 0; max-width: 100%; overflow: hidden; }
    .admin-panel-grid { display: grid; grid-template-columns: 1fr; gap: 12px; min-width: 0; max-width: 100%; }
    .admin-source-card { min-width: 0; max-width: 100%; overflow: hidden; }
    .admin-source-footer { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; min-width: 0; }
    .admin-user-row { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(130px, 0.55fr) minmax(170px, 0.8fr); gap: 10px; align-items: center; }
    @media (min-width: 760px) {
      .admin-panel-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (min-width: 1120px) {
      .admin-panel-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 560px) {
      .modal-overlay { align-items: flex-end; padding: max(12px, env(safe-area-inset-top)) 10px max(12px, env(safe-area-inset-bottom)); }
      .modal-box { max-height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 24px); overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; border-radius: 18px; }
      .meal-plan-row { grid-template-columns: 34px minmax(0, 1fr); align-items: start; }
      .meal-plan-title, .meal-plan-meta { white-space: normal; overflow-wrap: anywhere; }
      .meal-plan-actions { grid-column: 2; justify-content: flex-start; min-width: 0; flex-wrap: wrap; }
      .admin-header-inner, .admin-content { width: calc(100vw - 20px); }
      .admin-content { padding-top: 12px; }
      .admin-user-row { grid-template-columns: 1fr; align-items: stretch; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <!-- App source lives in src/app.jsx. Edit there, then run `npm run build:app`
       to regenerate this precompiled bundle. Do NOT hand-edit public/app.js. -->
  <script src="/app.js"></script>
</body>
</html>
