<!doctype html>
<html><head><title>Lemon Tart</title>
<script type="application/ld+json">
{
  "@context": "https://schema.org/",
  "@type": "Recipe",
  "name": "Lemon Tart",
  "image": "https://example.com/tart.jpg",
  "recipeYield": ["8", "8 servings"],
  "prepTime": "PT30M",
  "cookTime": "PT35M",
  "recipeIngredient": [
    "1 1/4 cups all-purpose flour",
    "1/2 cup butter, cold",
    "1/4 cup powdered sugar",
    "3 large eggs",
    "3/4 cup granulated sugar",
    "2/3 cup lemon juice",
    "1 tablespoon lemon zest"
  ],
  "recipeInstructions": [
    {
      "@type": "HowToSection",
      "name": "Crust",
      "itemListElement": [
        { "@type": "HowToStep", "text": "Pulse the flour, butter, and powdered sugar into a crumbly dough." },
        { "@type": "HowToStep", "text": "Press into a tart pan and blind-bake until pale gold." }
      ]
    },
    {
      "@type": "HowToSection",
      "name": "Lemon Filling",
      "itemListElement": [
        { "@type": "HowToStep", "text": "Whisk the eggs, granulated sugar, lemon juice, and zest." },
        { "@type": "HowToStep", "text": "Pour into the crust and bake until just set, then chill." }
      ]
    }
  ]
}
</script>
</head><body><h1>Lemon Tart</h1></body></html>
